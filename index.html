<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personal Planner</title>
<meta name="description" content="Planner harian, mingguan, tujuan, dan refleksi. Data tersimpan di perangkat Anda dan bisa dipakai tanpa internet.">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: header pill-nav tetap di atas, satu kolom konten ber-container, kartu kaca, timeline "quest log" untuk kegiatan.
   Gaya mengikuti portofolio: navy gelap, gradien indigo→ungu, aksen cyan, label pixel. Gelap adalah bawaan, terang tersedia. */
:root{
  color-scheme:dark;
  --bg:#0b1020;
  --surface:rgba(30,41,59,.55);
  --surface-solid:#111a2e;
  --border:rgba(148,163,184,.16);
  --border-strong:rgba(148,163,184,.32);
  --text:#e2e8f0;
  --muted:#94a3b8;
  --heading:#f8fafc;
  --primary:#6366f1;
  --secondary:#a855f7;
  --accent:#22d3ee;
  --on-grad:#ffffff;
  --grad:linear-gradient(135deg,var(--primary),var(--secondary));
  --ok:#34d399;
  --warn:#fbbf24;
  --bad:#f87171;
  --info:#60a5fa;
  --field:rgba(0,0,0,.25);
  --field-focus:rgba(0,0,0,.4);
  --hover:rgba(255,255,255,.06);
  --chip-bg:rgba(99,102,241,.14);
  --chip-bd:rgba(99,102,241,.3);
  --track:rgba(148,163,184,.18);
  --header-bg:rgba(11,16,32,.78);
  --glow1:rgba(99,102,241,.22);
  --glow2:rgba(168,85,247,.16);
  --gridline:rgba(255,255,255,.035);
  --shadow:0 18px 40px rgba(0,0,0,.35);
  --scrim:rgba(5,8,20,.72);
  --btn-glow:0 6px 24px rgba(99,102,241,.35);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-pixel:"Silkscreen","Courier New",ui-monospace,monospace;
  --radius:18px;--radius-sm:12px;--header-h:68px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f5fc;--surface:rgba(255,255,255,.78);--surface-solid:#ffffff;
  --border:rgba(30,37,90,.12);--border-strong:rgba(30,37,90,.28);
  --text:#2a3152;--muted:#5b6482;--heading:#0d1330;
  --primary:#4f46e5;--secondary:#9333ea;--accent:#0e7490;
  --ok:#047857;--warn:#a16207;--bad:#b91c1c;--info:#1d4ed8;
  --field:rgba(255,255,255,.9);--field-focus:#ffffff;--hover:rgba(30,37,90,.06);
  --chip-bg:rgba(79,70,229,.1);--chip-bd:rgba(79,70,229,.26);--track:rgba(30,37,90,.12);
  --header-bg:rgba(243,245,252,.85);--glow1:rgba(99,102,241,.16);--glow2:rgba(168,85,247,.12);--gridline:rgba(30,37,90,.05);
  --shadow:0 18px 40px rgba(30,37,90,.14);--scrim:rgba(20,26,60,.5);--btn-glow:0 6px 20px rgba(79,70,229,.28);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5fc;--surface:rgba(255,255,255,.78);--surface-solid:#ffffff;
  --border:rgba(30,37,90,.12);--border-strong:rgba(30,37,90,.28);
  --text:#2a3152;--muted:#5b6482;--heading:#0d1330;
  --primary:#4f46e5;--secondary:#9333ea;--accent:#0e7490;
  --ok:#047857;--warn:#a16207;--bad:#b91c1c;--info:#1d4ed8;
  --field:rgba(255,255,255,.9);--field-focus:#ffffff;--hover:rgba(30,37,90,.06);
  --chip-bg:rgba(79,70,229,.1);--chip-bd:rgba(79,70,229,.26);--track:rgba(30,37,90,.12);
  --header-bg:rgba(243,245,252,.85);--glow1:rgba(99,102,241,.16);--glow2:rgba(168,85,247,.12);--gridline:rgba(30,37,90,.05);
  --shadow:0 18px 40px rgba(30,37,90,.14);--scrim:rgba(20,26,60,.5);--btn-glow:0 6px 20px rgba(79,70,229,.28);
}
:root[data-theme="dark"]{color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:1rem;line-height:1.7;color:var(--text);background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:var(--bg)}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 520px at 8% -8%,var(--glow1),transparent 62%),
   radial-gradient(760px 460px at 100% 12%,var(--glow2),transparent 62%),
   linear-gradient(var(--gridline) 1px,transparent 1px) 0 0/48px 48px,
   linear-gradient(90deg,var(--gridline) 1px,transparent 1px) 0 0/48px 48px;
  -webkit-mask-image:linear-gradient(#000 55%,transparent 100%);mask-image:linear-gradient(#000 55%,transparent 100%);
  transform:translateZ(0)}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;color:var(--heading);line-height:1.2}
p{margin:0 0 1rem}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.container{width:min(1120px,100%);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.text-gradient{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--primary)}

/* Header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;height:var(--header-h);background:var(--header-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.site-header.is-scrolled{border-bottom-color:var(--border)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.brand__dot{color:var(--accent);-webkit-text-fill-color:var(--accent)}
.nav__menu{display:flex;align-items:center;gap:2px}
.nav__link{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-size:.9rem;font-weight:500;color:var(--muted);border-radius:999px;transition:color .2s,background .2s}
.nav__link:hover{color:var(--heading)}
.nav__link.is-active{color:var(--heading);background:var(--hover)}
.nav__toggle{display:none;width:44px;height:44px;align-items:center;justify-content:center;font-size:1.4rem;color:var(--heading);background:transparent;border:1px solid var(--border);border-radius:12px;cursor:pointer}

/* Layout */
main{padding-block:clamp(28px,5vw,52px) 40px;min-height:70vh}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(24px,4vw,36px)}
.page-head__text{min-width:0;max-width:640px}
.page-title{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.page-lead{margin:12px 0 0;color:var(--muted);font-size:1.02rem}
.eyebrow{display:inline-block;margin-bottom:12px;font-family:var(--font-pixel);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero__badge{display:inline-flex;align-items:center;gap:10px;margin:0 0 20px;padding:6px 14px 6px 10px;font-size:.82rem;color:var(--muted);border:1px solid var(--border);border-radius:999px;background:var(--hover)}
.hero__badge .ic{color:var(--accent)}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:14px 40px;margin:0 0 clamp(28px,4vw,40px);padding-top:24px;border-top:1px solid var(--border)}
.stat__num{display:block;font-size:1.7rem;font-weight:700;color:var(--heading);line-height:1.1;font-variant-numeric:tabular-nums}
.stat__label{font-size:.8rem;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:grid;gap:20px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.sec-head h2{font-size:1.25rem;font-weight:600}
.sec-head .eyebrow{margin-bottom:4px}

/* Components */
.glass{background:var(--surface);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--radius)}
.panel{padding:24px;min-width:0}
.panel h2{font-size:1.1rem;font-weight:600;margin-bottom:14px}
.panel__eyebrow{display:block;margin-bottom:6px;font-family:var(--font-pixel);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lift{transition:transform .3s,border-color .3s,box-shadow .3s}
.lift:hover{transform:translateY(-4px);border-color:var(--secondary);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 24px;font:600 .92rem/1 var(--font);color:var(--heading);background:transparent;border:1px solid var(--border-strong);border-radius:999px;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s}
.btn:hover{transform:translateY(-2px);border-color:var(--text);background:var(--hover)}
.btn--primary{border-color:transparent;background:var(--grad);color:var(--on-grad);box-shadow:var(--btn-glow)}
.btn--primary:hover{border-color:transparent;background:var(--grad);filter:brightness(1.1)}
.btn--sm{padding:8px 15px;font-size:.8rem}
.btn--danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn--danger:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn--ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.btn--ok:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.btn--solid-danger{border-color:transparent;background:var(--bad);color:#fff}
.btn--solid-danger:hover{background:var(--bad);filter:brightness(1.1);border-color:transparent}
.btn--icon{padding:9px 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;font-size:.76rem;font-weight:500;line-height:1.6;color:var(--text);background:var(--chip-bg);border:1px solid var(--chip-bd);border-radius:999px;max-width:100%}
.chip--cyan{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--accent)}
.chip--warn{background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.bar{height:8px;background:var(--track);border-radius:999px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:inherit;transition:width .5s}
.pb{display:flex;gap:12px;align-items:center}
.pb b{font-variant-numeric:tabular-nums;min-width:3ch;color:var(--heading)}
.mini{padding:14px 16px;background:var(--hover);border:1px solid var(--border);border-radius:var(--radius-sm)}
.mini__label{display:block;margin-bottom:2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mini p:last-child{margin-bottom:0}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:var(--radius-sm);font-size:.9rem;border:1px solid;margin-bottom:24px}
.notice p{margin:0 0 4px}.notice p:last-child{margin:0}
.notice--warn{color:var(--text);background:color-mix(in srgb,var(--warn) 11%,transparent);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.notice--warn .ic{color:var(--warn);margin-top:3px}
.notice--info{color:var(--text);background:color-mix(in srgb,var(--accent) 9%,transparent);border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.notice--info .ic{color:var(--accent);margin-top:3px}
.notice__body{min-width:0;flex:1}
.empty{padding:28px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);margin:0}

/* Forms */
label{display:block;margin-top:14px;font-size:.85rem;font-weight:500;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px 14px;color:var(--heading);background:var(--field);border:1px solid var(--border);border-radius:var(--radius-sm);transition:border-color .2s,background .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:var(--field-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 28%,transparent)}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{display:inline-block;width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--primary)}
.check-label{display:flex;align-items:center;color:var(--text);font-size:.92rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-warn{display:none;margin-top:14px}
.form-warn.show{display:flex}

/* Timeline (quest log) */
.timeline{position:relative;display:grid;gap:18px;padding-left:34px;min-width:0}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--secondary),transparent)}
.tl-item{position:relative;padding:20px 22px;min-width:0;--st:var(--primary)}
.tl-item::before{content:"";position:absolute;left:-34px;top:24px;width:20px;height:20px;background:var(--bg);border:3px solid var(--st);border-radius:6px}
.tl-item.st-done{--st:var(--ok)}.tl-item.st-done::before{background:var(--ok)}
.tl-item.st-pending{--st:var(--warn)}
.tl-item.st-skipped{--st:var(--bad)}
.tl-item.st-progress{--st:var(--accent)}
.tl-item__top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-bottom:4px}
.tl-item__status{font-family:var(--font-pixel);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--st)}
.tl-item__time{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item h3{font-size:1.08rem;font-weight:600;margin-bottom:10px;overflow-wrap:anywhere}
.tl-item p{font-size:.9rem;color:var(--muted);margin:10px 0 0}
.tl-item p b{color:var(--text);font-weight:500}
.tl-item .mini{margin-top:12px;font-size:.9rem}
.tl-item .actions{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border-strong)}

/* Mingguan */
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{padding:14px 12px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day__name{font-family:var(--font-pixel);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.day__date{font-size:.8rem;color:var(--muted)}
.daytask{display:block;width:100%;text-align:left;padding:6px 8px;font-size:.76rem;line-height:1.4;color:var(--text);background:var(--chip-bg);border:1px solid var(--chip-bd);border-radius:8px;cursor:pointer;overflow-wrap:anywhere}
.daytask:hover{border-color:var(--primary)}
.daytask b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);margin-right:4px}
.daytask.st-done{opacity:.6;text-decoration:line-through}
.day .btn{margin-top:auto}

/* Kalender */
.cal-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cal-month{min-width:9.5em;text-align:center;font-weight:600;color:var(--heading)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calendar .dow{text-align:center;font-family:var(--font-pixel);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:74px;padding:7px 8px;color:var(--text);background:var(--hover);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.cell:hover{border-color:var(--primary)}
.cell.today{border-color:var(--accent)}
.cell.selected{background:var(--chip-bg);border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cell .num{font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.cell .dots{display:flex;flex-wrap:wrap;gap:3px}
.dot{width:7px;height:7px;border-radius:2px;background:var(--primary)}
.dot.st-done{background:var(--ok)}.dot.st-pending{background:var(--warn)}.dot.st-skipped{background:var(--bad)}.dot.st-progress{background:var(--accent)}
.cell small{font-size:.66rem;color:var(--muted);line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Goals */
.goals{display:grid;gap:20px}
.goal__head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.goal__head h2{margin:0 0 8px;font-size:1.25rem}
.targets{display:grid;gap:10px;margin:18px 0 6px}
.target__row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;margin-bottom:10px}
.target__row b{font-weight:600;color:var(--heading);overflow-wrap:anywhere}
.target__row small{color:var(--muted);font-size:.78rem}

/* Review */
.cat-row{margin:16px 0}
.cat-row__top{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:.92rem}
.cat-row__top b{font-variant-numeric:tabular-nums;color:var(--heading)}
.done-list{display:grid;gap:10px;margin-top:16px}

/* Modal + toast */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.modal{width:100%;max-width:580px;max-height:90vh;overflow:auto;padding:26px;background:var(--surface-solid);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow)}
.modal h3{font-size:1.2rem;font-weight:600;margin-bottom:6px}
.modal>p{color:var(--muted);font-size:.92rem}
.modal pre{margin:12px 0 0;max-height:40vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:300;max-width:calc(100% - 32px);padding:10px 20px;font-size:.88rem;font-weight:500;color:var(--on-grad);background:var(--grad);border-radius:999px;box-shadow:var(--btn-glow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Pengaturan */
.settings{display:grid;gap:20px;max-width:760px}
.settings p{color:var(--muted);font-size:.92rem}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--muted)}
.sync[data-s="synced"]::before{background:var(--ok)}
.sync[data-s="syncing"]::before{background:var(--accent)}
.sync[data-s="error"]::before,.sync[data-s="slow"]::before{background:var(--warn)}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
textarea.code{min-height:200px;font:.78rem/1.5 ui-monospace,monospace}

.site-footer{margin-top:20px;padding-block:28px;border-top:1px solid var(--border)}
.footer__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.site-footer p{margin:0;font-size:.82rem;color:var(--muted)}

.chip--ok{background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok)}
.avatar{position:relative;display:grid;place-items:center;width:44px;height:44px;flex:none;overflow:hidden;font-weight:600;font-size:.95rem;color:#fff;background:var(--grad);border-radius:12px}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.acct{display:flex;align-items:center;gap:14px;min-width:0}
.gate-card{max-width:600px;margin:clamp(0px,4vh,40px) auto 0;padding:clamp(24px,4vw,40px)}
.disclosure ul.plain{margin:8px 0 0;padding-left:18px;display:grid;gap:8px;font-size:.92rem;color:var(--text)}
.gate-err{margin:12px 0 0;color:var(--bad);font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.gate .nav__toggle,.gate .nav__menu,.gate .site-footer .sync{display:none}
.admin-tools{display:flex;flex-wrap:wrap;gap:12px;flex:1 1 320px;max-width:520px}
.admin-tools>div{flex:1 1 150px;min-width:0}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.member{display:flex;flex-direction:column;gap:14px;padding:20px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}
.member__top{display:flex;align-items:center;gap:14px;min-width:0}
.member__name{display:block;color:var(--heading);font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.member__mail{display:block;overflow-wrap:anywhere;line-height:1.3}
.member__meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.82rem;color:var(--muted)}
.member__meta b{color:var(--heading);font-weight:600}
.member-head{display:grid;gap:14px;margin-bottom:22px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
.tab{padding:8px 16px;font:500 .88rem/1 var(--font);color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.tab:hover{color:var(--heading)}
.tab.on{color:var(--heading);background:var(--hover);border-color:var(--border-strong)}
.daysec{margin:28px 0 14px;font-family:var(--font-pixel);font-size:.78rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.week-nav{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

@media (max-width:1000px){
  .weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .day{min-height:0}
}
@media (max-width:900px){
  .nav__toggle{display:inline-flex}
  .nav__menu{position:absolute;top:var(--header-h);left:0;right:0;display:none;flex-direction:column;align-items:stretch;gap:4px;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--border)}
  .nav__menu.is-open{display:flex}
  .nav__link{padding:12px 16px}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .grid3,.grid2{grid-template-columns:minmax(0,1fr)}
  .timeline{padding-left:28px}
  .tl-item{padding:16px 16px}
  .tl-item::before{left:-28px;top:20px}
  .timeline::before{left:5px}
  .panel{padding:20px}
  .cell{min-height:58px;padding:5px}
  .cell small{display:none}
  .stats{gap:14px 28px}
  .modal{padding:20px}
  .head-actions .btn{flex:1}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="site-header" id="header">
  <nav class="container nav" aria-label="Navigasi utama">
    <a class="brand text-gradient" href="#dash">PLANNER<span class="brand__dot">.</span></a>
    <button class="nav__toggle" id="navToggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navMenu"></button>
    <div class="nav__menu" id="navMenu"></div>
  </nav>
</header>

<main class="container" id="main"></main>

<footer class="site-footer">
  <div class="container footer__inner">
    <p id="footNote">Personal Planner v2.0 · rencana, tujuan, dan refleksi mingguan</p>
    <span class="sync" data-s="local" id="syncFoot">Tersimpan di perangkat ini</span>
  </div>
</footer>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
'use strict';
/* ---------- util ---------- */
const $=s=>document.querySelector(s), BASEKEY='personal-planner.v2';
let KEY=BASEKEY;
const CATS=['Pendidikan','Pekerjaan','Ibadah','Kesehatan','Pengembangan Diri','Lainnya'];
const PRIORITIES=['Rendah','Sedang','Tinggi'];
const REASONS=['Sengaja dilewati','Ada kegiatan mendadak','Tidak sempat','Jadwal berubah','Alasan lainnya'];
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PAGES=[['dash','Dashboard','dash'],['mingguan','Mingguan','week'],['kalender','Kalender','cal'],['goals','Goals','goals'],['review','Review','review'],['riwayat','Riwayat','history'],['pengaturan','Pengaturan','gear']];
const CLOUD=!!(window.Cloud&&Cloud.enabled());
const CONSENT_VERSION=1;
const AUTH={state:'ready',user:null,admin:false,agree:false,err:'',busy:false,offline:false};
const visiblePages=()=>AUTH.admin?[...PAGES,['admin','Admin','shield']]:PAGES;
const ICONS={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 week:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 14h5"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>',
 goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 review:'<path d="M5 3h11l3 3v15H5z"/><path d="M9 8h4M9 12h6M9 16h6"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 logout:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12l5 5L20 7"/>',play:'<path d="M7 4l13 8-13 8z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 repeat:'<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',upload:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const dateObj=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=dateObj(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const monday=s=>addDays(s,-((dateObj(s).getDay()+6)%7));
const fmt=s=>{const d=dateObj(s);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
const fmtShort=s=>{const d=dateObj(s);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`};
const timeNow=()=>new Date().toTimeString().slice(0,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
const blank=()=>({version:2,sample:false,updatedAt:0,acts:[],goals:[],weeks:{},reviews:{},settings:{theme:'dark',notifications:false,reminderMinutes:15},logs:[]});
let S=blank();
function normalize(raw){const b=blank();return {...b,...raw,settings:{...b.settings,...(raw.settings||{})},weeks:raw.weeks||{},reviews:raw.reviews||{},logs:raw.logs||[]}}
function validBackup(d){return d&&Array.isArray(d.acts)&&Array.isArray(d.goals)&&d.acts.every(a=>a&&typeof a.name==='string'&&typeof a.date==='string'&&typeof a.id==='string')&&d.goals.every(g=>g&&typeof g.title==='string'&&Array.isArray(g.targets))}
function seed(){
  const t=today(),d=n=>addDays(t,n),T=[uid(),uid(),uid(),uid()],G=[uid(),uid()];
  const A=(date,start,end,name,cat,priority,ti,x={})=>{const g=ti!=null?(ti<3?G[0]:G[1]):'';return {id:uid(),name,date,start,end,cat,priority,goalId:g,targetId:ti!=null?T[ti]:'',purpose:'',expected:'',note:'',status:'scheduled',...x}};
  const s=blank();s.sample=true;
  s.goals=[
    {id:G[0],title:'Menguasai Web Development',term:'Jangka menengah',deadline:d(90),desc:'Bisa membangun satu website dari nol sampai online.',targets:[{id:T[0],title:'Memahami HTML dan CSS'},{id:T[1],title:'Memahami JavaScript'},{id:T[2],title:'Membuat proyek sederhana'}]},
    {id:G[1],title:'Hidup lebih sehat',term:'Jangka pendek',deadline:d(30),desc:'',targets:[{id:T[3],title:'Olahraga 3 kali seminggu'}]}
  ];
  s.acts=[
    A(d(-1),'19:00','20:00','Latihan layout CSS Grid','Pendidikan','Sedang',0,{status:'done',actual:'Selesai membuat layout galeri 3 kolom.'}),
    A(d(-1),'16:00','16:45','Olahraga sore','Kesehatan','Sedang',3,{status:'skipped',skipReason:'Ada kegiatan mendadak'}),
    A(t,'06:00','06:30','Olahraga pagi','Kesehatan','Sedang',3,{status:'done',actual:'Jogging 25 menit.'}),
    A(t,'09:00','10:30','Belajar JavaScript: DOM dan event','Pendidikan','Tinggi',1,{purpose:'Supaya bisa membuat fitur interaktif',expected:'Menyelesaikan 3 latihan'}),
    A(t,'13:00','15:00','Kerjakan halaman Kontak di portofolio','Pekerjaan','Tinggi',2,{purpose:'Portofolio siap dibagikan',expected:'Form kontak berfungsi'}),
    A(t,'20:00','20:30','Evaluasi harian dan rencana besok','Pengembangan Diri','Rendah',null),
    A(d(1),'09:00','11:00','Belajar fetch API','Pendidikan','Sedang',1),
    A(d(2),'15:00','16:30','Revisi portofolio setelah masukan guru','Pekerjaan','Tinggi',2),
    A(d(3),'06:00','06:30','Olahraga pagi','Kesehatan','Sedang',3)
  ];
  s.weeks[monday(t)]={focus:'Menyelesaikan interaktivitas halaman portofolio',targets:'Latihan DOM selesai, halaman Kontak jadi',priorities:'JavaScript dulu, baru desain',notes:'Kerja di pagi hari saat fokus masih penuh.'};
  return s;
}
function load(){
  try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&validBackup(raw)){S=normalize(raw);return}}catch(e){console.warn('Data planner tidak dapat dibaca',e)}
  S=CLOUD?blank():seed();
}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function save(){S.updatedAt=Date.now();const ok=localSave();queueRemote();if(!ok)toast('Penyimpanan gagal. Ekspor cadangan terlebih dahulu.')}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}

/* ---------- akun dan sinkron (Firebase) ---------- */
const SYNC_TXT={local:'Tersimpan di perangkat ini',syncing:'Menyinkronkan…',synced:'Tersinkron ke server',error:'Gagal sinkron, data aman di perangkat ini',slow:'Server belum terjangkau, memakai data perangkat',offline:'Offline, disinkronkan saat online'};
let syncState='local';
function syncLabels(){document.querySelectorAll('.sync').forEach(e=>{e.dataset.s=syncState;e.textContent=SYNC_TXT[syncState]||SYNC_TXT.local})}
function setSync(s){syncState=s;syncLabels()}
const remote={uid:null,ready:false,busy:false,dirty:false,timer:null,unsub:null};
const consentKey=uid=>'planner.consent.'+uid;
function getConsent(uid){try{const v=JSON.parse(localStorage.getItem(consentKey(uid))||'null');return v&&v.v===CONSENT_VERSION?v:null}catch(e){return null}}
function setConsent(uid){const v={v:CONSENT_VERSION,at:Date.now()};try{localStorage.setItem(consentKey(uid),JSON.stringify(v))}catch(e){}return v}
function lastUser(){try{return JSON.parse(localStorage.getItem('planner.lastUser')||'null')}catch(e){return null}}
const isTyping=()=>!$('#overlay').hidden||/INPUT|TEXTAREA|SELECT/.test((document.activeElement&&document.activeElement.tagName)||'');

function queueRemote(){
  if(!CLOUD||!remote.uid||!remote.ready)return;
  clearTimeout(remote.timer);setSync('syncing');remote.timer=setTimeout(pushRemote,1200);
}
async function pushRemote(){
  const u=AUTH.user;
  if(!CLOUD||!u||!remote.uid)return;
  if(remote.busy){remote.dirty=true;return}
  remote.busy=true;remote.timer=null;
  try{
    if(!S.updatedAt){S.updatedAt=Date.now();localSave()}
    const c=getConsent(u.uid)||{v:CONSENT_VERSION,at:Date.now()};
    await Cloud.put(u.uid,{name:u.name,email:u.email,photo:u.photo,consent:c,state:JSON.stringify(S),updatedAt:S.updatedAt});
    setSync('synced');
  }catch(e){
    console.warn('Sinkron gagal',e);setSync(navigator.onLine?'error':'offline');
    clearTimeout(remote.retry);remote.retry=setTimeout(()=>{if(remote.ready)pushRemote()},30000);
  }
  remote.busy=false;
  if(remote.dirty){remote.dirty=false;pushRemote()}
}
window.addEventListener('online',()=>{
  if(!CLOUD)return;
  if(AUTH.offline)bootCloud();
  else if(remote.ready&&syncState!=='synced')pushRemote();
});

function startRemote(u){
  remote.uid=u.uid;remote.ready=false;
  setSync('syncing');
  const slow=setTimeout(()=>{if(!remote.ready)setSync('slow')},10000);
  remote.unsub=Cloud.watch(u.uid,(d,meta)=>{
    if(meta&&meta.hasPendingWrites)return;
    if(meta&&meta.fromCache&&!remote.ready)return;   // tunggu jawaban server dulu
    clearTimeout(slow);remote.ready=true;
    if(d&&typeof d.updatedAt==='number'&&d.updatedAt>S.updatedAt){
      try{const r=JSON.parse(d.state);if(validBackup(r)){S=normalize(r);S.updatedAt=d.updatedAt;localSave();applyTheme();if(!isTyping())render()}}catch(e){console.warn(e)}
      setSync('synced');
    }else if(!d||(d.updatedAt||0)<S.updatedAt){
      if(!S.updatedAt){S.updatedAt=Date.now();localSave()}
      pushRemote();
    }else setSync('synced');
  },err=>{clearTimeout(slow);console.warn(err);setSync('error')});
}
function stopRemote(){
  if(remote.unsub){try{remote.unsub()}catch(e){}remote.unsub=null}
  clearTimeout(remote.timer);clearTimeout(remote.retry);
  remote.uid=null;remote.ready=false;remote.dirty=false;
  if(typeof adminStop==='function')adminStop();
}

async function bootCloud(){
  if(AUTH.state!=='ready'){AUTH.state='init';AUTH.err='';render()}
  try{await Cloud.init()}catch(e){console.warn('Firebase gagal dimuat',e);return cloudOffline()}
  if(!bootCloud.bound){bootCloud.bound=true;Cloud.onAuth(onAuthChange)}
}
function cloudOffline(){
  const lu=lastUser();
  if(lu&&lu.uid&&getConsent(lu.uid)){
    AUTH.offline=true;AUTH.user=lu;AUTH.admin=false;enterApp(lu,true);setSync('offline');
  }else{
    AUTH.state='error';AUTH.err='Layanan masuk tidak dapat dimuat. Periksa koneksi internet, lalu coba lagi.';render();
  }
}
function onAuthChange(u){
  if(!u){stopRemote();AUTH.user=null;AUTH.admin=false;AUTH.offline=false;AUTH.state='out';AUTH.busy=false;render();return}
  if(AUTH.state==='ready'&&AUTH.user&&AUTH.user.uid===u.uid&&!AUTH.offline&&remote.unsub)return;
  AUTH.user=u;AUTH.admin=Cloud.isAdmin(u.email);AUTH.offline=false;
  try{localStorage.setItem('planner.lastUser',JSON.stringify(u))}catch(e){}
  let pending=null;try{pending=localStorage.getItem('planner.consent.pending')}catch(e){}
  if(pending===String(CONSENT_VERSION)&&!getConsent(u.uid))setConsent(u.uid);
  try{localStorage.removeItem('planner.consent.pending')}catch(e){}
  if(!getConsent(u.uid)){AUTH.state='consent';render();return}
  enterApp(u);
}
function enterApp(u,offline){
  stopRemote();
  KEY=BASEKEY+'.'+u.uid;
  S=blank();
  try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&validBackup(raw))S=normalize(raw)}catch(e){}
  AUTH.state='ready';applyTheme();
  V.page=pageFromHash()||'dash';V.month=today().slice(0,7);V.selected=today();V.week=monday(today());
  render();
  if(!offline)startRemote(u);
}
function authError(e){
  const c=(e&&e.code)||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return 'Jendela masuk ditutup sebelum selesai. Coba lagi.';
  if(c==='auth/unauthorized-domain')return 'Alamat situs ini belum diizinkan di Firebase. Tambahkan di Authentication, Settings, Authorized domains.';
  if(c==='auth/network-request-failed')return 'Tidak ada koneksi internet. Coba lagi setelah tersambung.';
  if(c==='auth/operation-not-allowed')return 'Login Google belum diaktifkan di Firebase (Authentication, Sign-in method).';
  return 'Gagal masuk'+(c?' ('+c+')':'')+'. Coba lagi.';
}
async function gateSignIn(){
  if(!AUTH.agree||AUTH.busy)return;
  try{localStorage.setItem('planner.consent.pending',String(CONSENT_VERSION))}catch(e){}
  AUTH.busy=true;AUTH.err='';render();
  try{await Cloud.signIn()}catch(e){AUTH.err=authError(e);try{localStorage.removeItem('planner.consent.pending')}catch(_){}}
  AUTH.busy=false;if(AUTH.state!=='ready')render();
}
function gateContinue(){if(!AUTH.agree||!AUTH.user)return;setConsent(AUTH.user.uid);enterApp(AUTH.user)}
async function doSignOut(){
  if(AUTH.offline){
    stopRemote();try{localStorage.removeItem('planner.lastUser')}catch(e){}
    AUTH.user=null;AUTH.admin=false;AUTH.offline=false;AUTH.state='error';AUTH.err='Anda sedang offline. Masuk lagi setelah tersambung ke internet.';render();return;
  }
  stopRemote();
  try{await Cloud.signOut()}catch(e){toast('Gagal keluar. Coba lagi.')}
}
function leaveShare(){
  const u=AUTH.user;if(!u)return;
  confirmBox('Hapus data Anda dari server dan keluar? Data di perangkat ini tetap ada, tetapi admin tidak lagi bisa melihatnya.','Hapus dan keluar',async()=>{
    stopRemote();
    try{await Cloud.remove(u.uid)}catch(e){toast('Gagal menghapus data di server. Periksa koneksi lalu coba lagi.');startRemote(u);return}
    try{localStorage.removeItem(consentKey(u.uid))}catch(e){}
    try{await Cloud.signOut()}catch(e){}
  });
}

/* ---------- view state ---------- */
let V={page:'dash',month:today().slice(0,7),selected:today(),week:monday(today()),historyFilter:'all'};
const getTask=id=>S.acts.find(a=>a.id===id);
const taskStatus=a=>{if(a.status==='done'||a.status==='skipped')return a.status;if(a.status==='progress')return 'progress';const end=a.end||a.start;return a.date<today()||(a.date===today()&&end<timeNow())?'pending':'scheduled'};
const statusLabel=s=>({scheduled:'Terjadwal',progress:'Sedang dikerjakan',done:'Selesai',pending:'Menunggu konfirmasi',skipped:'Terlewat'}[s]||s);
const tasksOn=d=>S.acts.filter(a=>a.date===d).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
const goalById=id=>S.goals.find(g=>g.id===id);
const targetById=id=>{for(const g of S.goals)for(const t of g.targets)if(t.id===id)return t;return null};
function targetProgress(t){const a=S.acts.filter(x=>x.targetId===t.id),d=a.filter(x=>x.status==='done').length;return {total:a.length,done:d,pct:a.length?Math.round(d/a.length*100):0}}
function goalProgress(g){if(!g.targets.length)return 0;return Math.round(g.targets.reduce((n,t)=>n+targetProgress(t).pct,0)/g.targets.length)}
const timeRange=a=>`${esc(a.start||'')}${a.end?' – '+esc(a.end):''}`;

/* ---------- routing ---------- */
function pageFromHash(){const h=(location.hash||'').slice(1);return visiblePages().some(p=>p[0]===h)?h:null}
function nav(p){
  V.page=p;
  try{if(location.hash!=='#'+p)location.hash=p}catch(e){}
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const p=pageFromHash();if(p&&p!==V.page){V.page=p;render();window.scrollTo(0,0)}});

/* ---------- dialog ---------- */
function openModal(html){const m=$('#modal');m.innerHTML=html;$('#overlay').hidden=false;const f=m.querySelector('input:not([type=hidden]),textarea,select');(f||m.querySelector('button'))?.focus()}
function closeModal(){$('#overlay').hidden=true;$('#modal').innerHTML='';dlgCb=null}
$('#overlay').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden)closeModal();setMenu(false)}});
let dlgCb=null;
function confirmBox(msg,okLabel,fn,danger=true){
  openModal(`<h3>${esc(msg)}</h3><div class="actions"><button type="button" class="btn btn--sm" onclick="closeModal()">Batal</button><button type="button" class="btn btn--sm ${danger?'btn--solid-danger':'btn--primary'}" id="dlgOk">${esc(okLabel)}</button></div>`);
  dlgCb=fn;$('#dlgOk').onclick=()=>{const f=dlgCb;closeModal();f&&f()};
}
function promptBox({title,label,value='',placeholder='',okLabel='Simpan',required=false,multiline=true},fn){
  const field=multiline?`<textarea name="v" id="dlgField" rows="3" placeholder="${esc(placeholder)}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="v" id="dlgField" placeholder="${esc(placeholder)}" value="${esc(value)}" ${required?'required':''}>`;
  openModal(`<h3>${esc(title)}</h3><form id="dlgForm"><label for="dlgField">${esc(label)}</label>${field}<div class="actions"><button type="button" class="btn btn--sm" onclick="closeModal()">Batal</button><button class="btn btn--sm btn--primary">${esc(okLabel)}</button></div></form>`);
  $('#dlgForm').onsubmit=e=>{e.preventDefault();const v=new FormData(e.target).get('v').trim();if(required&&!v)return;closeModal();fn(v)};
}
function options(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}

/* ---------- kegiatan ---------- */
function taskCard(a,showDate=false){
  const st=taskStatus(a),g=goalById(a.goalId),t=targetById(a.targetId);
  return `<article class="tl-item glass st-${st}">
 <div class="tl-item__top"><span class="tl-item__status">${statusLabel(st)}</span><span class="tl-item__time">${showDate?fmtShort(a.date)+' · ':''}${timeRange(a)}</span></div>
 <h3>${esc(a.name)}</h3>
 <div class="chips"><span class="chip">${esc(a.cat)}</span><span class="chip ${a.priority==='Tinggi'?'chip--warn':''}">Prioritas ${esc(a.priority)}</span>${g?`<span class="chip chip--cyan">${ic('goals')} ${esc(g.title)}</span>`:''}${t?`<span class="chip">${esc(t.title)}</span>`:''}</div>
 ${a.purpose?`<p><b>Tujuan</b> · ${esc(a.purpose)}</p>`:''}${a.expected?`<p><b>Target hasil</b> · ${esc(a.expected)}</p>`:''}
 ${a.actual?`<div class="mini"><span class="mini__label">Hasil aktual</span>${esc(a.actual)}</div>`:''}
 ${st==='skipped'&&a.skipReason?`<div class="mini"><span class="mini__label">Alasan terlewat</span>${esc(a.skipReason)}</div>`:''}
 ${a.note?`<p>${esc(a.note)}</p>`:''}
 <div class="actions">
 ${st!=='done'?`<button class="btn btn--sm btn--ok" onclick="markDone('${a.id}')">${ic('check')} Selesai</button>`:`<button class="btn btn--sm" onclick="undoDone('${a.id}')">${ic('undo')} Batalkan selesai</button>`}
 ${st==='scheduled'||st==='pending'?`<button class="btn btn--sm" onclick="startTask('${a.id}')">${ic('play')} Mulai</button>`:''}
 ${st==='pending'||st==='progress'?`<button class="btn btn--sm btn--danger" onclick="markSkipped('${a.id}')">${ic('flag')} Terlewat</button>`:''}
 <button class="btn btn--sm" onclick="taskForm('${a.id}')">${ic('edit')} Edit</button><button class="btn btn--sm" onclick="reschedule('${a.id}')">${ic('repeat')} Jadwal ulang</button><button class="btn btn--sm btn--danger btn--icon" aria-label="Hapus kegiatan" onclick="deleteTask('${a.id}')">${ic('trash')}</button>
 </div></article>`;
}
function taskForm(id='',date=V.selected){
  const a=id?getTask(id):{name:'',date,start:'08:00',end:'',cat:CATS[0],priority:'Sedang',goalId:'',targetId:'',purpose:'',expected:'',note:''};
  const goals=S.goals.map(g=>`<optgroup label="${esc(g.title)}">${g.targets.map(t=>`<option value="${t.id}" ${t.id===a.targetId?'selected':''}>${esc(t.title)}</option>`).join('')}</optgroup>`).join('');
  openModal(`<h3>${id?'Edit kegiatan':'Tambah kegiatan'}</h3><form id="taskFormEl" onsubmit="return saveTask(event,'${id}')">
<input type="hidden" name="force" value="">
<label for="f-name">Nama kegiatan</label><input id="f-name" name="name" required maxlength="120" value="${esc(a.name)}" placeholder="Contoh: Belajar PHP">
<div class="grid3"><div><label for="f-date">Tanggal</label><input id="f-date" type="date" name="date" required value="${a.date}"></div><div><label for="f-start">Mulai</label><input id="f-start" type="time" name="start" required value="${a.start||''}"></div><div><label for="f-end">Selesai</label><input id="f-end" type="time" name="end" value="${a.end||''}"></div></div>
<label for="f-purpose">Tujuan kegiatan</label><input id="f-purpose" name="purpose" value="${esc(a.purpose)}" placeholder="Mengapa ini penting?">
<label for="f-expected">Target hasil</label><input id="f-expected" name="expected" value="${esc(a.expected)}" placeholder="Hasil yang ingin dicapai">
<div class="grid3"><div><label for="f-cat">Kategori</label><select id="f-cat" name="cat">${options(CATS,a.cat)}</select></div><div><label for="f-pri">Prioritas</label><select id="f-pri" name="priority">${options(PRIORITIES,a.priority)}</select></div><div><label for="f-target">Target tujuan</label><select id="f-target" name="targetId"><option value="">Tidak terkait</option>${goals}</select></div></div>
<label for="f-note">Catatan</label><textarea id="f-note" name="note" rows="2">${esc(a.note)}</textarea>
<div class="notice notice--warn form-warn" id="formWarn">${ic('alert')}<div class="notice__body" id="formWarnText"></div></div>
<div class="actions"><button type="button" class="btn btn--sm" onclick="closeModal()">Batal</button><button class="btn btn--sm btn--primary" id="taskSubmit">Simpan</button></div></form>`);
}
function saveTask(e,id){
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target));f.name=f.name.trim();
  if(!f.name){toast('Nama kegiatan wajib diisi.');return false}
  if(f.end&&f.end<=f.start){toast('Jam selesai harus setelah jam mulai.');return false}
  const clash=S.acts.find(a=>a.id!==id&&a.date===f.date&&a.start&&f.start&&a.start<(f.end||f.start)&&(!a.end||a.end>f.start));
  if(clash&&f.force!=='1'){
    e.target.elements.force.value='1';
    $('#formWarnText').textContent=`Jadwal bertabrakan dengan "${clash.name}" (${clash.start}${clash.end?'–'+clash.end:''}). Tekan "Tetap simpan" untuk melanjutkan.`;
    $('#formWarn').classList.add('show');$('#taskSubmit').textContent='Tetap simpan';return false;
  }
  delete f.force;
  const target=targetById(f.targetId);f.goalId=target?(S.goals.find(g=>g.targets.some(t=>t.id===target.id))||{}).id||'':'';
  if(id)Object.assign(getTask(id),f);else S.acts.push({id:uid(),...f,status:'scheduled',createdAt:new Date().toISOString()});
  V.selected=f.date;V.month=f.date.slice(0,7);save();closeModal();render();toast('Kegiatan tersimpan');return false;
}
function startTask(id){const a=getTask(id);if(!a)return;a.status='progress';save();render();toast('Kegiatan dimulai')}
function undoDone(id){const a=getTask(id);if(!a)return;delete a.actual;delete a.doneAt;a.status='scheduled';save();render();toast('Status dikembalikan')}
function markDone(id){
  const a=getTask(id);if(!a)return;
  promptBox({title:'Catat hasil aktual',label:'Apa yang berhasil dikerjakan? (boleh dikosongkan)',value:a.actual||'',okLabel:'Tandai selesai'},v=>{a.actual=v;a.doneAt=new Date().toISOString();a.status='done';save();render();toast('Kegiatan selesai')});
}
function markSkipped(id){
  const a=getTask(id);if(!a)return;
  openModal(`<h3>Mengapa kegiatan ini terlewat?</h3><p>${esc(a.name)}</p><form id="skipForm"><label for="sk-r">Alasan</label><select id="sk-r" name="reason">${options(REASONS,'')}</select><label for="sk-n">Catatan tambahan (opsional)</label><textarea id="sk-n" name="note" rows="2"></textarea><div class="actions"><button type="button" class="btn btn--sm" onclick="closeModal()">Batal</button><button class="btn btn--sm btn--primary">Tandai terlewat</button></div></form>`);
  $('#skipForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));a.status='skipped';a.skipReason=f.reason+(f.note.trim()?': '+f.note.trim():'');a.skippedAt=new Date().toISOString();save();closeModal();render();toast('Dicatat sebagai terlewat')};
}
function deleteTask(id){const a=getTask(id);if(!a)return;confirmBox(`Hapus kegiatan "${a.name}"?`,'Hapus',()=>{S.acts=S.acts.filter(x=>x.id!==id);save();render();toast('Kegiatan dihapus')})}
function reschedule(id){
  const a=getTask(id);if(!a)return;
  openModal(`<h3>Jadwalkan ulang</h3><p>${esc(a.name)}</p><form id="rsForm"><label for="rs-d">Tanggal baru</label><input id="rs-d" type="date" name="date" required min="${today()}" value="${a.date<today()?today():a.date}"><div class="grid2"><div><label for="rs-s">Mulai</label><input id="rs-s" type="time" name="start" required value="${a.start||''}"></div><div><label for="rs-e">Selesai</label><input id="rs-e" type="time" name="end" value="${a.end||''}"></div></div><label for="rs-r">Alasan</label><textarea id="rs-r" name="reason" rows="2"></textarea><div class="actions"><button type="button" class="btn btn--sm" onclick="closeModal()">Batal</button><button class="btn btn--sm btn--primary">Simpan jadwal</button></div></form>`);
  $('#rsForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.end&&f.end<=f.start){toast('Jam selesai tidak valid.');return}
    S.logs.push({taskId:id,name:a.name,from:{date:a.date,start:a.start},to:{date:f.date,start:f.start},reason:f.reason,at:new Date().toISOString()});
    Object.assign(a,{date:f.date,start:f.start,end:f.end,status:'scheduled'});save();closeModal();render();toast('Jadwal diperbarui')};
}

/* ---------- goals ---------- */
function addGoalForm(){
  openModal(`<h3>Tujuan baru</h3><form id="goalForm"><label for="g-t">Nama tujuan</label><input id="g-t" name="title" required placeholder="Contoh: Menguasai Web Development"><div class="grid2"><div><label for="g-term">Jangka waktu</label><select id="g-term" name="term"><option>Jangka pendek</option><option>Jangka menengah</option><option>Jangka panjang</option></select></div><div><label for="g-dl">Batas waktu</label><input id="g-dl" type="date" name="deadline"></div></div><label for="g-d">Deskripsi</label><textarea id="g-d" name="desc" rows="2"></textarea><label for="g-tg">Target (satu target per baris)</label><textarea id="g-tg" name="targets" rows="4" placeholder="Memahami HTML dan CSS&#10;Memahami JavaScript&#10;Membuat proyek sederhana"></textarea><div class="actions"><button type="button" class="btn btn--sm" onclick="closeModal()">Batal</button><button class="btn btn--sm btn--primary">Simpan tujuan</button></div></form>`);
  $('#goalForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    S.goals.push({id:uid(),title:f.title.trim(),term:f.term,deadline:f.deadline,desc:f.desc.trim(),targets:f.targets.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({id:uid(),title}))});
    save();closeModal();render();toast('Tujuan tersimpan')};
}
function addTarget(gid){promptBox({title:'Target baru',label:'Nama target',placeholder:'Contoh: Memahami Git dan GitHub',required:true,multiline:false,okLabel:'Tambah target'},v=>{goalById(gid).targets.push({id:uid(),title:v});save();render()})}
function deleteGoal(gid){const g=goalById(gid);confirmBox(`Hapus tujuan "${g.title}"? Kegiatan terkait tetap disimpan.`,'Hapus tujuan',()=>{S.goals=S.goals.filter(x=>x.id!==gid);S.acts.forEach(a=>{if(a.goalId===gid){a.goalId='';a.targetId=''}});save();render()})}
function deleteTarget(gid,tid){const t=targetById(tid);confirmBox(`Hapus target "${t.title}"?`,'Hapus target',()=>{const g=goalById(gid);g.targets=g.targets.filter(x=>x.id!==tid);S.acts.forEach(a=>{if(a.targetId===tid){a.targetId='';a.goalId=''}});save();render()})}

/* ---------- halaman ---------- */
function secHead(eyebrow,title,right=''){return `<div class="sec-head"><div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2></div>${right}</div>`}
function sampleBanner(){return S.sample?`<div class="notice notice--info">${ic('info')}<div class="notice__body"><p><b>Ini data contoh.</b> Kegiatan, tujuan, dan rencana di bawah dibuat agar Anda bisa mencoba semua fitur.</p><div class="actions" style="margin-top:10px"><button class="btn btn--sm" onclick="clearSample()">Mulai dari kosong</button><button class="btn btn--sm" onclick="keepSample()">Simpan sebagai data saya</button></div></div></div>`:''}
function clearSample(){const t=S.settings;S=blank();S.settings=t;save();render();toast('Data contoh dihapus')}
function keepSample(){S.sample=false;save();render()}

function dashboard(){
  const t=today(),td=tasksOn(t),done=td.filter(a=>a.status==='done').length,pct=td.length?Math.round(done/td.length*100):0;
  const up=S.acts.filter(a=>(a.date>t||(a.date===t&&taskStatus(a)==='scheduled'))&&['scheduled','progress'].includes(taskStatus(a))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,5);
  const high=S.acts.filter(a=>a.priority==='Tinggi'&&['scheduled','pending','progress'].includes(taskStatus(a))&&a.date<=addDays(t,2));
  const wk=S.weeks[monday(t)]||{};
  const dd=dateObj(t);
  return `${sampleBanner()}${installBanner()}
<header class="page-head"><div class="page-head__text">
 <p class="hero__badge">${ic('clock')} ${DAYS[dd.getDay()]}, ${fmt(t)}</p>
 <h1 class="page-title">Rencana <span class="text-gradient">hari ini</span></h1>
 <p class="page-lead">${td.length?`${done} dari ${td.length} kegiatan sudah selesai. ${done===td.length?'Semua tuntas hari ini.':'Lanjutkan satu per satu.'}`:'Belum ada kegiatan untuk hari ini. Tambahkan yang pertama.'}</p></div>
 <div class="head-actions"><button class="btn btn--primary" onclick="taskForm('','${t}')">${ic('plus')} Tambah kegiatan</button><button class="btn" onclick="nav('mingguan')">Rencana minggu ini</button></div></header>
<div class="stats"><div class="stat"><span class="stat__num">${td.length}</span><span class="stat__label">Kegiatan hari ini</span></div><div class="stat"><span class="stat__num">${done}</span><span class="stat__label">Selesai</span></div><div class="stat"><span class="stat__num">${pct}%</span><span class="stat__label">Penyelesaian</span></div><div class="stat"><span class="stat__num">${S.goals.length}</span><span class="stat__label">Tujuan aktif</span></div></div>
${high.length?`<div class="notice notice--warn">${ic('alert')}<div class="notice__body"><p><b>Prioritas tinggi dalam 2 hari ke depan</b></p>${high.map(a=>`<p>${esc(a.name)} · ${fmtShort(a.date)} ${esc(a.start)}</p>`).join('')}</div></div>`:''}
<div class="split"><section>
 ${secHead('Quest log','Kegiatan hari ini')}
 <div class="pb" style="margin-bottom:22px"><b>${done}/${td.length}</b><div class="bar"><i style="width:${td.length?done/td.length*100:0}%"></i></div></div>
 ${td.length?`<div class="timeline">${td.map(a=>taskCard(a)).join('')}</div>`:'<p class="empty">Belum ada kegiatan hari ini.</p>'}
</section><div class="stack">
 <section class="glass panel"><span class="panel__eyebrow">Berikutnya</span><h2>Jadwal mendatang</h2>${up.map(a=>`<div class="mini" style="margin-bottom:10px"><b style="color:var(--heading);font-weight:600">${esc(a.name)}</b><br><small class="muted">${fmtShort(a.date)} · ${esc(a.start)}</small></div>`).join('')||'<p class="empty">Belum ada jadwal berikutnya.</p>'}</section>
 <section class="glass panel"><span class="panel__eyebrow">Tujuan</span><h2>Progres tujuan</h2>${S.goals.slice(0,5).map(g=>`<p style="margin:0 0 4px;font-size:.92rem;color:var(--heading)">${esc(g.title)}</p><div class="pb" style="margin-bottom:16px"><div class="bar"><i style="width:${goalProgress(g)}%"></i></div><b>${goalProgress(g)}%</b></div>`).join('')||'<p class="empty">Buat tujuan pertama di menu Goals.</p>'}</section>
 <section class="glass panel"><span class="panel__eyebrow">Minggu ini</span><h2>Fokus mingguan</h2><p>${esc(wk.focus||'Belum ada fokus mingguan.')}</p><button class="btn btn--sm" onclick="nav('mingguan')">Buka rencana mingguan</button></section>
</div></div>`;
}

function saveWeek(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.weeks[V.week]={focus:f.focus,targets:f.targets,priorities:f.priorities,notes:f.notes};save();toast('Rencana mingguan tersimpan');return false}
function weekNavBtns(w){return `<div class="head-actions"><button class="btn btn--icon" aria-label="Minggu sebelumnya" onclick="V.week='${addDays(w,-7)}';render()">${ic('left')}</button><button class="btn" onclick="V.week='${monday(today())}';render()">Minggu ini</button><button class="btn btn--icon" aria-label="Minggu berikutnya" onclick="V.week='${addDays(w,7)}';render()">${ic('right')}</button></div>`}
function weekPage(){
  const w=V.week,days=Array.from({length:7},(_,i)=>addDays(w,i)),plan=S.weeks[w]||{},end=addDays(w,6);
  return `<header class="page-head"><div class="page-head__text"><span class="eyebrow">// Mingguan</span><h1 class="page-title">Weekly <span class="text-gradient">Planning</span></h1><p class="page-lead">${fmt(w)} – ${fmt(end)}</p></div>${weekNavBtns(w)}</header>
<form class="glass panel" onsubmit="return saveWeek(event)" style="margin-bottom:32px"><span class="panel__eyebrow">Arah minggu ini</span><h2>Fokus dan target</h2>
 <label for="w-f">Fokus utama</label><input id="w-f" name="focus" value="${esc(plan.focus||'')}" placeholder="Apa hal terpenting minggu ini?">
 <div class="grid2"><div><label for="w-t">Target yang ingin dicapai</label><textarea id="w-t" name="targets" rows="2">${esc(plan.targets||'')}</textarea></div><div><label for="w-p">Prioritas utama</label><textarea id="w-p" name="priorities" rows="2">${esc(plan.priorities||'')}</textarea></div></div>
 <label for="w-n">Catatan / strategi</label><textarea id="w-n" name="notes" rows="2">${esc(plan.notes||'')}</textarea>
 <div class="actions"><button class="btn btn--primary btn--sm">Simpan rencana</button></div></form>
${secHead('Tujuh hari','Jadwal minggu ini',`<button class="btn btn--primary btn--sm" onclick="taskForm('','${days.includes(today())?today():w}')">${ic('plus')} Kegiatan</button>`)}
<div class="weekgrid">${days.map(d=>{const l=tasksOn(d),o=dateObj(d);return `<div class="day glass ${d===today()?'today':''}"><span class="day__name">${DAYS[o.getDay()].slice(0,3)}</span><span class="day__date">${fmtShort(d)}</span>${l.map(a=>`<button class="daytask st-${taskStatus(a)}" onclick="V.selected='${d}';V.month='${d.slice(0,7)}';nav('kalender')"><b>${esc(a.start)}</b>${esc(a.name)}</button>`).join('')||'<small class="muted">Kosong</small>'}<button class="btn btn--sm" onclick="taskForm('','${d}')">${ic('plus')} Tambah</button></div>`}).join('')}</div>`;
}

function changeMonth(n){const d=new Date(V.month+'-01T12:00:00');d.setMonth(d.getMonth()+n);V.month=d.toISOString().slice(0,7);render()}
function calendarPage(){
  const [y,m]=V.month.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),cells=Array(offset).fill('<div></div>');
  for(let i=1;i<=days;i++){const d=`${V.month}-${String(i).padStart(2,'0')}`,list=tasksOn(d);
    cells.push(`<button class="cell ${d===today()?'today':''} ${d===V.selected?'selected':''}" aria-label="${i} ${MONTHS[m-1]}, ${list.length} kegiatan" onclick="V.selected='${d}';render()"><span class="num">${i}</span><span class="dots">${list.slice(0,6).map(a=>`<i class="dot st-${taskStatus(a)}"></i>`).join('')}</span><small>${list.length?list.length+' kegiatan':''}</small></button>`)}
  const list=tasksOn(V.selected);
  return `<header class="page-head"><div class="page-head__text"><span class="eyebrow">// Kalender</span><h1 class="page-title"><span class="text-gradient">Kalender</span> kegiatan</h1><p class="page-lead">Pilih tanggal untuk melihat dan merencanakan kegiatan.</p></div>

function applyTheme(){const t=S.settings.theme,r=document.documentElement;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);try{const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||'#0b1020'}catch(e){}}

function exportData(){
  const json=JSON.stringify({...S,version:2,exportedAt:new Date().toISOString()},null,2),name=`planner-backup-${today()}.json`;

let pendingImport=null;
function importData(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader();
  reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!validBackup(d))throw new Error('Struktur data tidak sesuai');pendingImport=d;
    confirmBox('Impor akan mengganti data saat ini. Lanjutkan?','Ganti dengan cadangan',()=>{S=normalize(pendingImport);pendingImport=null;S.sample=false;save();applyTheme();render();toast('Cadangan berhasil dipulihkan')},true)}

    finally{e.target.value=''}};

function reminders(){
  try{if(!S.settings.notifications||!('Notification' in window)||Notification.permission!=='granted')return;
    const now=new Date();let changed=false;
    for(const a of S.acts){if(a.status==='done'||a.status==='skipped'||!a.start)continue;const diff=(new Date(`${a.date}T${a.start}:00`)-now)/60000;
      if(diff>=0&&diff<=S.settings.reminderMinutes&&a.lastReminder!==a.date+' '+a.start){notify(`${a.name} dimulai ${Math.max(0,Math.round(diff))} menit lagi.`);a.lastReminder=a.date+' '+a.start;changed=true}}
    if(changed)save();
  }catch(e){}
}

function parseMember(m){try{const r=JSON.parse(m.state);if(validBackup(r))return normalize(r)}catch(e){}return null}
function memberInfo(m){
  const st=parseMember(m);
  const idleH=m.updatedAt?(Date.now()-m.updatedAt)/3600000:Infinity;
  if(!st)return {st:null,td:{n:0,d:0},wk:{n:0,done:0,skip:0,pend:0,due:0,pct:0},pend7:0,idleH,flags:['Data tidak terbaca']};
  return withState(st,()=>{
    const t=today(),w=monday(t),e=addDays(w,6);
    const tl=tasksOn(t),td={n:tl.length,d:tl.filter(a=>a.status==='done').length};
    const wl=S.acts.filter(a=>a.date>=w&&a.date<=e);
    const due=wl.filter(a=>['done','skipped','pending'].includes(taskStatus(a)));
    const done=wl.filter(a=>a.status==='done').length;
    const wk={n:wl.length,done,skip:wl.filter(a=>taskStatus(a)==='skipped').length,pend:wl.filter(a=>taskStatus(a)==='pending').length,due:due.length,pct:due.length?Math.round(done/due.length*100):0};
    const pend7=S.acts.filter(a=>taskStatus(a)==='pending'&&a.date>=addDays(t,-7)).length;
    const flags=[];
    if(pend7)flags.push(pend7+' belum dikonfirmasi');
    if(idleH>48)flags.push('Tidak aktif '+Math.floor(idleH/24)+' hari');
    if(wk.due>=3&&wk.pct<50)flags.push('Penyelesaian rendah');
    return {st,td,wk,pend7,idleH,flags};
  });
}
function adminOpen(uid){ADM.uid=uid;ADM.tab='today';ADM.week=monday(today());ADM.limit=40;ADM.filter='all';render();window.scrollTo(0,0)}
function adminBack(){ADM.uid=null;render();window.scrollTo(0,0)}
function adminTab(t){ADM.tab=t;refreshAdmin()}

function adminPage(){
  const tb=ADM.uid
    ?`<div class="head-actions"><button class="btn" onclick="adminBack()">${ic('left')} Semua anggota</button></div>`
    :`<div class="admin-tools"><div><label for="adm-q" style="margin-top:0">Cari anggota</label><input id="adm-q" type="search" value="${esc(ADM.q)}" placeholder="Nama atau email" oninput="ADM.q=this.value;refreshAdmin()"></div><div><label for="adm-s" style="margin-top:0">Urutkan</label><select id="adm-s" onchange="ADM.sort=this.value;refreshAdmin()"><option value="attention" ${ADM.sort==='attention'?'selected':''}>Perlu perhatian</option><option value="name" ${ADM.sort==='name'?'selected':''}>Nama</option><option value="pct" ${ADM.sort==='pct'?'selected':''}>Penyelesaian terendah</option><option value="recent" ${ADM.sort==='recent'?'selected':''}>Terakhir aktif</option></select></div></div>`;
  return `<header class="page-head"><div class="page-head__text"><span class="eyebrow">// Admin</span><h1 class="page-title">Pantauan <span class="text-gradient">anggota</span></h1><p class="page-lead">${ADM.uid?'Isi planner anggota. Hanya bisa dilihat, tidak bisa diubah.':'Semua yang masuk dan membagikan planner mereka dengan Anda.'}</p></div>${tb}</header><div id="admBody">${adminBody()}</div>`;
}
function adminBody(){
  if(ADM.err)return `<div class="notice notice--warn">${ic('alert')}<div class="notice__body">${esc(ADM.err)}</div></div>`;
  if(ADM.loading&&!ADM.list.length)return '<p class="empty">Memuat data anggota…</p>';
  return ADM.uid?adminDetail():adminMembers();
}
function adminMembers(){
  const all=ADM.list.map(m=>({m,i:memberInfo(m)}));
  const t=today();
  const activeToday=all.filter(r=>r.m.updatedAt&&msDate(r.m.updatedAt)===t).length;
  const withDue=all.filter(r=>r.i.wk.due>0);
  const avg=withDue.length?Math.round(withDue.reduce((n,r)=>n+r.i.wk.pct,0)/withDue.length):0;
  const attn=all.filter(r=>r.i.flags.length).length;
  let rows=all.slice();
  const q=ADM.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>((r.m.name||'')+' '+(r.m.email||'')).toLowerCase().includes(q));
  const byName=(a,b)=>(a.m.name||'').localeCompare(b.m.name||'');
  if(ADM.sort==='name')rows.sort(byName);
  else if(ADM.sort==='pct')rows.sort((a,b)=>(a.i.wk.due?a.i.wk.pct:101)-(b.i.wk.due?b.i.wk.pct:101)||byName(a,b));
  else if(ADM.sort==='recent')rows.sort((a,b)=>(b.m.updatedAt||0)-(a.m.updatedAt||0));
  else rows.sort((a,b)=>b.i.flags.length-a.i.flags.length||(a.m.updatedAt||0)-(b.m.updatedAt||0));
  const strip=`<div class="stats"><div class="stat"><span class="stat__num">${all.length}</span><span class="stat__label">Anggota</span></div><div class="stat"><span class="stat__num">${activeToday}</span><span class="stat__label">Aktif hari ini</span></div><div class="stat"><span class="stat__num">${avg}%</span><span class="stat__label">Rata-rata penyelesaian minggu ini</span></div><div class="stat"><span class="stat__num">${attn}</span><span class="stat__label">Perlu perhatian</span></div></div>`;
  if(!all.length)return strip+'<p class="empty">Belum ada anggota yang masuk. Bagikan alamat aplikasi ini kepada mereka.</p>';
  if(!rows.length)return strip+'<p class="empty">Tidak ada anggota yang cocok dengan pencarian.</p>';
  return strip+`<div class="members">${rows.map(({m,i})=>`<button class="glass member lift" onclick="adminOpen('${esc(m.uid)}')">
 <div class="member__top">${avatar(m.name,m.photo)}<div style="min-width:0"><b class="member__name">${esc(m.name||'Tanpa nama')}</b><small class="muted member__mail">${esc(m.email||'')}</small></div></div>
 <div class="member__meta"><span>Hari ini <b>${i.td.d}/${i.td.n}</b></span><span>Aktif <b>${agoText(m.updatedAt)}</b></span></div>
 <div><div class="cat-row__top" style="margin-bottom:6px"><span class="muted" style="font-size:.82rem">Minggu ini</span><b>${i.wk.due?i.wk.pct+'%':'-'}</b></div><div class="bar"><i style="width:${i.wk.pct}%"></i></div></div>
 <div class="chips">${i.flags.map(f=>`<span class="chip chip--warn">${esc(f)}</span>`).join('')||'<span class="chip chip--ok">Aman</span>'}</div></button>`).join('')}</div>`;
}
const taskCardRO=(a,showDate)=>taskCard(a,showDate).replace(/<div class="actions">[\s\S]*<\/div><\/article>\s*$/,'</article>');
const roList=(l,showDate)=>l.length?`<div class="timeline">${l.map(a=>taskCardRO(a,showDate)).join('')}</div>`:'<p class="empty">Tidak ada kegiatan.</p>';
function adminDetail(){
  const m=ADM.list.find(x=>x.uid===ADM.uid);
  if(!m)return '<p class="empty">Anggota tidak ditemukan. Mungkin sudah menghapus datanya.</p>';
  const st=parseMember(m);
  const tabs=[['today','Hari ini'],['week','Mingguan'],['all','Semua kegiatan'],['goals','Tujuan'],['log','Jadwal ulang']];
  const head=`<section class="glass panel member-head"><div class="member__top">${avatar(m.name,m.photo)}<div style="min-width:0"><h2 style="margin:0;overflow-wrap:anywhere">${esc(m.name||'Tanpa nama')}</h2><small class="muted" style="overflow-wrap:anywhere">${esc(m.email||'')}</small></div></div>
<div class="member__meta"><span>Terakhir aktif <b>${agoText(m.updatedAt)}</b></span>${m.consent&&m.consent.at?`<span>Setuju dilihat admin <b>${fmt(msDate(m.consent.at))}</b></span>`:''}</div></section>`;
  const nav=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${ADM.tab===k?'on':''}" role="tab" aria-selected="${ADM.tab===k}" onclick="adminTab('${k}')">${l}</button>`).join('')}</div>`;
  if(!st)return head+'<p class="empty">Data anggota tidak terbaca.</p>';
  return head+nav+`<div class="admin-tab">${withState(st,()=>adminTabBody())}</div>`;
}
function adminTabBody(){
  const t=today();
  if(ADM.tab==='today'){
    const td=tasksOn(t),done=td.filter(a=>a.status==='done').length;
    const up=S.acts.filter(a=>a.date>t&&['scheduled','progress'].includes(taskStatus(a))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,5);
    return `<div class="stats"><div class="stat"><span class="stat__num">${td.length}</span><span class="stat__label">Kegiatan hari ini</span></div><div class="stat"><span class="stat__num">${done}</span><span class="stat__label">Selesai</span></div><div class="stat"><span class="stat__num">${td.length?Math.round(done/td.length*100):0}%</span><span class="stat__label">Penyelesaian</span></div></div>
${secHead('Quest log','Hari ini, '+fmt(t))}${roList(td,false)}
${up.length?`<div style="height:32px"></div>${secHead('Berikutnya','Jadwal mendatang')}${roList(up,true)}`:''}`;
  }
  if(ADM.tab==='week'){
    const w=ADM.week,end=addDays(w,6),days=Array.from({length:7},(_,i)=>addDays(w,i)),plan=S.weeks[w]||{},rv=S.reviews[w]||{answers:[],next:''};
    const list=S.acts.filter(a=>a.date>=w&&a.date<=end),done=list.filter(a=>a.status==='done').length,skip=list.filter(a=>taskStatus(a)==='skipped').length,pend=list.filter(a=>taskStatus(a)==='pending').length;
    const due=list.filter(a=>['done','skipped','pending'].includes(taskStatus(a))),pct=due.length?Math.round(done/due.length*100):0;
    const cats=CATS.map(c=>{const a=due.filter(x=>x.cat===c),d=a.filter(x=>x.status==='done').length;return {c,n:a.length,p:a.length?Math.round(d/a.length*100):0}}).filter(x=>x.n);
    const box=(l,v)=>`<div class="mini"><span class="mini__label">${l}</span>${v?esc(v):'<span class="muted">Belum diisi</span>'}</div>`;
    const dayHtml=days.map(d=>{const l=tasksOn(d);return l.length?`<h3 class="daysec">${DAYS[dateObj(d).getDay()]} · ${fmtShort(d)}</h3>${roList(l,false)}`:''}).join('');
    return `<div class="week-nav"><div><span class="eyebrow">Minggu</span><h2 style="font-size:1.25rem">${fmt(w)} – ${fmt(end)}</h2></div><div class="head-actions"><button class="btn btn--icon" aria-label="Minggu sebelumnya" onclick="ADM.week='${addDays(w,-7)}';refreshAdmin()">${ic('left')}</button><button class="btn" onclick="ADM.week='${monday(t)}';refreshAdmin()">Minggu ini</button><button class="btn btn--icon" aria-label="Minggu berikutnya" onclick="ADM.week='${addDays(w,7)}';refreshAdmin()">${ic('right')}</button></div></div>
<div class="stats"><div class="stat"><span class="stat__num">${list.length}</span><span class="stat__label">Direncanakan</span></div><div class="stat"><span class="stat__num">${done}</span><span class="stat__label">Selesai</span></div><div class="stat"><span class="stat__num">${skip}</span><span class="stat__label">Terlewat</span></div><div class="stat"><span class="stat__num">${pend}</span><span class="stat__label">Belum dikonfirmasi</span></div><div class="stat"><span class="stat__num">${pct}%</span><span class="stat__label">Penyelesaian</span></div></div>
<div class="split"><div class="stack"><section class="glass panel"><span class="panel__eyebrow">Rencana</span><h2>Arah minggu ini</h2><div class="stack" style="gap:10px">${box('Fokus utama',plan.focus)}${box('Target',plan.targets)}${box('Prioritas',plan.priorities)}${box('Catatan / strategi',plan.notes)}</div></section>
<section class="glass panel"><span class="panel__eyebrow">Per kategori</span><h2>Evaluasi kategori</h2>${cats.map(c=>`<div class="cat-row"><div class="cat-row__top"><span>${esc(c.c)} <small class="muted">(${c.n})</small></span><b>${c.p}%</b></div><div class="bar"><i style="width:${c.p}%"></i></div></div>`).join('')||'<p class="empty">Belum ada kegiatan jatuh tempo.</p>'}</section></div>
<section class="glass panel"><span class="panel__eyebrow">Refleksi</span><h2>Catatan mingguan</h2><div class="stack" style="gap:10px">${QUESTIONS.map((q,i)=>box(q,rv.answers[i])).join('')}${box('Prioritas minggu berikutnya',rv.next)}</div></section></div>
<div style="height:32px"></div>${secHead('Kegiatan','Per hari')}${dayHtml||'<p class="empty">Tidak ada kegiatan pada minggu ini.</p>'}`;
  }
  if(ADM.tab==='all'){
    const all=S.acts.filter(a=>ADM.filter==='all'||taskStatus(a)===ADM.filter).sort((a,b)=>(b.date+(b.start||'')).localeCompare(a.date+(a.start||'')));
    return `<div style="max-width:260px;margin-bottom:24px"><label for="adm-f" style="margin-top:0">Filter status</label><select id="adm-f" onchange="ADM.filter=this.value;ADM.limit=40;refreshAdmin()"><option value="all">Semua status (${S.acts.length})</option>${['scheduled','progress','done','pending','skipped'].map(s=>`<option value="${s}" ${ADM.filter===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></div>
${roList(all.slice(0,ADM.limit),true)}${all.length>ADM.limit?`<div class="actions"><button class="btn" onclick="ADM.limit+=40;refreshAdmin()">Tampilkan lebih banyak (${all.length-ADM.limit})</button></div>`:''}`;
  }
  if(ADM.tab==='goals'){
    return S.goals.length?`<div class="goals">${S.goals.map(g=>`<section class="glass panel"><div class="goal__head"><div style="min-width:0"><h2>${esc(g.title)}</h2><div class="chips"><span class="chip">${esc(g.term)}</span>${g.deadline?`<span class="chip chip--cyan">Batas ${fmt(g.deadline)}</span>`:''}</div></div></div>${g.desc?`<p class="muted">${esc(g.desc)}</p>`:''}<div class="pb"><b>${goalProgress(g)}%</b><div class="bar"><i style="width:${goalProgress(g)}%"></i></div></div><div class="targets">${g.targets.map(x=>{const p=targetProgress(x);return `<div class="mini"><div class="target__row"><b>${esc(x.title)}</b><small>${p.done}/${p.total} kegiatan selesai</small></div><div class="pb"><div class="bar"><i style="width:${p.pct}%"></i></div><b>${p.pct}%</b></div></div>`}).join('')}</div></section>`).join('')}</div>`:'<p class="empty">Belum ada tujuan.</p>';
  }
  return S.logs.length?S.logs.slice().reverse().map(l=>`<div class="mini" style="margin-bottom:10px"><b style="color:var(--heading);font-weight:600">${esc(l.name)}</b><br><small class="muted">${fmt(l.from.date)} ${esc(l.from.start)} → ${fmt(l.to.date)} ${esc(l.to.start)}${l.reason?' · '+esc(l.reason):''}</small></div>`).join(''):'<p class="empty">Belum ada perubahan jadwal.</p>';
}


/* ---------- render ---------- */
function setMenu(open){const m=$('#navMenu'),t=$('#navToggle');m.classList.toggle('is-open',open);t.setAttribute('aria-expanded',String(open));t.setAttribute('aria-label',open?'Tutup menu':'Buka menu');t.innerHTML=ic(open?'x':'menu')}
function renderNav(){$('#navMenu').innerHTML=(AUTH.state==='ready'?visiblePages():[]).map(([id,label,icon])=>`<a class="nav__link ${V.page===id?'is-active':''}" href="#${id}" ${V.page===id?'aria-current="page"':''}>${ic(icon)}<span>${label}</span></a>`).join('')}
$('#navToggle').addEventListener('click',()=>setMenu(!$('#navMenu').classList.contains('is-open')));
$('#navMenu').addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false)});
window.addEventListener('scroll',()=>$('#header').classList.toggle('is-scrolled',window.scrollY>8),{passive:true});
function render(){
  document.body.classList.toggle('gate',AUTH.state!=='ready');
  footNote();
  if(AUTH.state!=='ready'){$('#navMenu').innerHTML='';$('#main').innerHTML=gatePage();return}
  if(V.page==='admin'&&!AUTH.admin)V.page='dash';
  renderNav();
  const pages={dash:dashboard,mingguan:weekPage,kalender:calendarPage,goals:goalsPage,review:reviewPage,riwayat:historyPage,pengaturan:settingsPage,admin:adminPage};
  $('#main').innerHTML=pages[V.page]();
  if(V.page==='admin')adminAfterRender();
  syncLabels();
}

setMenu(false);
if(CLOUD){AUTH.state='init';applyTheme();render();bootCloud()}
else{load();applyTheme();V.page=pageFromHash()||'dash';render()}
setInterval(reminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)reminders()});
